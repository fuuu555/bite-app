services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bitemap}
      POSTGRES_USER: ${POSTGRES_USER:-bitemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitemap_local}
    ports:
      - "5433:5432"
    volumes:
      - bitemap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bitemap-postgres-data:
