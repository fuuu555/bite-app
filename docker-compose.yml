services:
  db:
    # PostgreSQL remains the durable source for application and chat data.
    # PostgreSQL 持續作為應用程式與聊天資料的永久來源。
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bitemap}
      POSTGRES_USER: ${POSTGRES_USER:-bitemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitemap_local_dev_only}
    ports:
      # Host 5433 avoids clashing with an existing local PostgreSQL on 5432.
      # 主機使用 5433，避免與本機既有 PostgreSQL 的 5432 衝突。
      - "5433:5432"
    volumes:
      - bitemap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    # Redis only transports live events; reconnects recover durable data from PostgreSQL.
    # Redis 只傳遞即時事件；重新連線後仍由 PostgreSQL 補齊永久資料。
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  bitemap-postgres-data:
